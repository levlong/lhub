<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Learning Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F3F4F0;
  --surface: #FFFFFF;
  --ink: #18202E;
  --muted: #596172;
  --line: #DADDD4;
  --hl: #FFE36A;
  --accent: #2A4ED4;
  --accent-ink: #FFFFFF;
  --accent-soft: #E6EBFB;
  --display: "Bricolage Grotesque", "Be Vietnam Pro", system-ui, sans-serif;
  --body: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11141A; --surface: #1A1F28; --ink: #E7E9EF; --muted: #9BA2B0; --line: #2B3240; --hl: #5E5112; --accent: #93A9FF; --accent-ink: #0E1220; --accent-soft: #232C47;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11141A; --surface: #1A1F28; --ink: #E7E9EF; --muted: #9BA2B0; --line: #2B3240; --hl: #5E5112; --accent: #93A9FF; --accent-ink: #0E1220; --accent-soft: #232C47;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.6; }
.wrap { max-width: 860px; margin: 0 auto; padding-inline: 16px; padding-block: 32px 64px; }
header .eyebrow { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin: 0; }
h1 { font-family: var(--display); font-weight: 800; font-size: clamp(40px, 8vw, 64px); line-height: 1; margin: 8px 0 12px; letter-spacing: -.02em; }
h1 .hl { background-image: linear-gradient(transparent 56%, var(--hl) 56%, var(--hl) 92%, transparent 92%); padding-inline: 2px; }
.lede { color: var(--muted); max-width: 60ch; margin: 0; font-size: 17px; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 16px; margin-top: 32px; }
.course { display: block; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 20px 22px; text-decoration: none; color: inherit; transition: border-color .15s; }
.course:hover { border-color: var(--accent); }
.course .tag { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); font-weight: 700; margin: 0 0 6px; }
.course h2 { font-family: var(--display); font-weight: 800; font-size: 22px; margin: 0 0 8px; }
.course p { margin: 0; color: var(--muted); font-size: 15px; }
.empty { color: var(--muted); font-size: 15px; margin-top: 32px; }
</style>

<div class="wrap">
  <header>
    <p class="eyebrow">Learning Hub</p>
    <h1>Learn <span class="hl">everything</span></h1>
    <p class="lede">A growing collection of self-contained learning modules — each with a syllabus, worked examples, and a quiz. Pick one below.</p>
  </header>
  <div class="grid">
    <a class="course" href="think_in_english.html">
      <p class="tag">6 bài · Tiếng Anh</p>
      <h2>Think in English</h2>
      <p>Ngừng dịch từng chữ từ tiếng Việt. Sửa các lỗi phổ biến qua thẻ ví dụ và bài kiểm tra.</p>
    </a>
  </div>
</div>
</body></html>
